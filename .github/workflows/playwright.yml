name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npx tsc --noEmit
            - run: npm run format:check

    agent-cli:
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            # Xray y CodeMie son integraciones privadas; este job verifica el
            # contrato del CLI sin simular ni escribir specs incompletos.
            - name: Agente AQA CLI
              run: npm run agent -- --help

    test:
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: npx playwright test --pass-with-no-tests --shard=${{ matrix.shard }}/2
              env:
                  BASE_URL: ${{ secrets.BASE_URL }}
                  USER_EMAIL: ${{ secrets.USER_EMAIL }}
                  USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
            - name: Upload report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-${{ matrix.shard }}
                  path: playwright-report/
                  retention-days: 7
