name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
            - run: npx tsc --noEmit
            - run: npm run format:check

    agent:
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            # El proveedor mock no usa red ni API keys: verifica que el pipeline del
            # agente sigue en pie (historia -> test cases -> cobertura -> codigo).
            - name: Agente AQA (proveedor mock)
              run: npm run agent:demo
              env:
                  BASE_URL: https://example.com
            - name: Upload artefactos del agente
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: agent-artifacts
                  path: |
                      agent/artifacts/
                      tests/generated/
                  retention-days: 7

    test:
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: npx playwright test --shard=${{ matrix.shard }}/2
              env:
                  BASE_URL: ${{ secrets.BASE_URL }}
                  USER_EMAIL: ${{ secrets.USER_EMAIL }}
                  USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
            - name: Upload report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-${{ matrix.shard }}
                  path: playwright-report/
                  retention-days: 7
